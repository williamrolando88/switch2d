[package]
name = "switch2d"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
authors = ["wmorales"]
description = "High-performance Linux userspace bridge and virtual gamepad daemon for Nintendo Switch 2 controllers"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
evdev = "0.12"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
